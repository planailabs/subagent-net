[workspace]
resolver = "3"
members = ["crates/*", "personality-example/crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
subnet-core = { path = "crates/core" }
subnet-llm = { path = "crates/llm" }
subnet-ops = { path = "crates/ops" }
subnet-cluster = { path = "crates/cluster" }
subnet-switchboard = { path = "crates/switchboard" }
anyhow = "1"
hcl-rs = "0.19"
indexmap = { version = "2", features = ["serde"] }
croner = { version = "4", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
globset = "0.4"
bytes = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rusqlite = { version = "0.39", features = ["bundled"] }
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
argon2 = "0.5"
rpassword = "7"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs"] }
gltf = "1"
hound = "3"
whisper-rs = "0.16"
mime_guess = "2"
ratatui = "0.30"
cel-interpreter = { version = "0.10", features = ["json"] }
clap = { version = "4", features = ["derive", "env", "string"] }
axum = { version = "0.8", features = ["ws"] }
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
schemars = { version = "1", features = ["uuid1", "indexmap2"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "3", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
sha2 = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Keep target/ small: line tables for our code, no debug info for
# dependencies (onnxruntime, whisper.cpp and fastembed are large).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
