[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
subnet-core = { path = "crates/core" }
subnet-llm = { path = "crates/llm" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
eventsource-stream = "0.2"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rmcp = { version = "3", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
sha2 = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
