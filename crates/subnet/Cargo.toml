[package]
name = "subnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
subnet-core.workspace = true
subnet-llm.workspace = true
subnet-ops.workspace = true
subnet-cluster.workspace = true
subnet-switchboard.workspace = true
bytes.workspace = true
base64.workspace = true
image.workspace = true
ratatui.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
indexmap.workspace = true
chrono.workspace = true
croner.workspace = true
globset.workspace = true
notify.workspace = true
schemars.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
fastembed = { workspace = true, optional = true }
clap.workspace = true
axum.workspace = true
regex.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rmcp.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
sha2.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "migrate", "macros"] }

[features]
default = ["webui", "router"]
# Serve the web UI (webui/dist, built with `npm run build`) from the hub.
webui = ["dep:rust-embed", "dep:mime_guess"]
# The tool router's default embedder (e5 via fastembed, downloaded on first use).
router = ["dep:fastembed"]

[dev-dependencies]
reqwest = { workspace = true, features = ["cookies"] }
