# Run with: subnet spawner -c examples/spawner.toml
hub = "ws://127.0.0.1:7700/spawner"
name = "laptop"
capacity = 8
token_env = "SUBNET_TOKEN"

[[type]]
name = "lead"
description = "Breaks a task down and delegates to workers."
system = "You are a lead engineer. Split work into focused subtasks, spawn workers for them, wait for their reports and combine the results."
model = { base_url = "https://api.openai.com/v1", model = "gpt-5", api_key_env = "OPENAI_API_KEY" }
spawns = ["worker"]
budget = { max_tokens = 2000000, max_depth = 2, max_children = 8 }

[[type]]
name = "worker"
description = "Does one focused task."
system = "You are a careful engineer. Do the task you are given and answer with the result."
model = { base_url = "http://127.0.0.1:8000/v1", model = "Qwen/Qwen3-32B", prefill = true }
budget = { max_tokens = 300000 }
