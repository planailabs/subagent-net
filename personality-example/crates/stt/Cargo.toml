[package]
name = "vesper-stt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "vesper-stt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hound.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
whisper-rs = { workspace = true, optional = true }

[features]
default = ["whisper"]
# Real transcription with whisper.cpp (built with cmake). Without it only
# --fake works.
whisper = ["dep:whisper-rs"]

[dev-dependencies]
vesper-room = { path = "../room" }
